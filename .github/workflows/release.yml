name: Release

# Push a tag like v0.8.0 to publish a signed APK. Installed apps find it through
# Settings → System → "Check for updates", or on their own at startup.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed APK
        working-directory: android
        env:
          APP_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are not set (see README, Releasing)"; exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/HermesRemote-$version.apk"
          (cd "$RUNNER_TEMP" && sha256sum "HermesRemote-$version.apk" > "HermesRemote-$version.apk.sha256")

      - name: Check signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$RUNNER_TEMP"/HermesRemote-*.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/HermesRemote-*.apk "$RUNNER_TEMP"/HermesRemote-*.apk.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
