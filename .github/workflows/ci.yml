name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run pytest -q

  # The bridge on Windows: the same tests, then the real PowerShell cmdlets the Windows host calls
  # and the real installer. A GitHub runner has Ethernet instead of Wi-Fi, but it has a default
  # route, a gateway and a firewall, which is what these code paths read.
  bridge-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync
      - run: uv run pytest -q
      - name: Installer and helper scripts parse
        shell: pwsh
        working-directory: .
        run: |
          foreach ($f in 'install.ps1', 'bridge/windows/run-bridge.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
      - name: Host probes answer on real Windows
        shell: pwsh
        run: |
          uv run python -c "
          from hermes_remote_bridge.host import host
          from hermes_remote_bridge import network
          h = host(); assert h.name == 'windows', h.name
          print('interfaces      ', h.interface_ips())
          route = h.default_route(); print('default route   ', route); assert route, 'no default route'
          print('gateway mac     ', h.gateway_mac(route[1]))
          print('profile         ', h.network_profile(route[0]))
          print('firewall active ', h.firewall_active())
          print('current network ', network.current_network())
          print('config dir      ', h.config_dir())
          "
      - name: Bridge CLI runs
        shell: pwsh
        run: |
          uv run hermes-remote-bridge devices
          uv run hermes-remote-bridge trust --list
          # Doctor exits 1 here (no Hermes on a runner) but must still print; a crash has "error:".
          $out = uv run hermes-remote-bridge doctor 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'Traceback|error:') { exit 1 }
          exit 0
      - name: Installer registers and starts the task
        shell: pwsh
        working-directory: .
        run: |
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP 'hermes'
          New-Item -ItemType Directory -Force $env:HERMES_HOME | Out-Null
          ./install.ps1 -Unattended
          Start-Sleep -Seconds 8
          $task = Get-ScheduledTask -TaskName 'Hermes Mobile Remote'
          "task state: $($task.State)"
          Get-Content "$env:LOCALAPPDATA\hermes-remote\state\bridge.log" -ErrorAction SilentlyContinue
          if (-not $task) { exit 1 }
          ./install.ps1 -Uninstall
          if (Get-ScheduledTask -TaskName 'Hermes Mobile Remote' -ErrorAction SilentlyContinue) { exit 1 }
      - name: Installer copes with uv missing (what a fresh PC looks like)
        shell: pwsh
        working-directory: .
        run: |
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP 'hermes'
          $uvDir = Split-Path (Get-Command uv).Source
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and ($_ -ne $uvDir) }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { Write-Error 'test setup: uv is still on PATH'; exit 1 }

          # 1. Unattended and no -InstallUv: must stop with a clear message, not a stack trace.
          $out = (& pwsh -NoProfile -File ./install.ps1 -Unattended 2>&1 | Out-String)
          Write-Host $out
          if ($LASTEXITCODE -eq 0 -or $out -notmatch 'uv is required') { Write-Error 'expected a clear uv-is-required stop'; exit 1 }

          # 2. -InstallUv: must install uv, find it in the same session and finish the install.
          ./install.ps1 -Unattended -InstallUv
          if (-not (Get-Command uv -ErrorAction SilentlyContinue)) { Write-Error 'uv still not found after -InstallUv'; exit 1 }
          Start-Sleep -Seconds 5
          (Get-ScheduledTask -TaskName 'Hermes Mobile Remote').State
          ./install.ps1 -Uninstall

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: HermesRemote-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
